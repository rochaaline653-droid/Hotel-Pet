<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hotel Pet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section>
            <h1>Hotel Pet</h1>
            <h2>Login</h2>
            <form action="paginas/reservas.html">
                <label for="login">Login</label>
                <input id="login" type="text" name="login" placeholder="Login">

                <label for="senha">Senha</label>
                <input id="senha" type="password" name="senha" placeholder="Senha">

                <label><input type="checkbox" name="lembrar"> Lembrar-me</label>

                <button type="submit">Entrar</button>
            </form>
            <a href="paginas/criar-conta.html">Criar uma conta</a>
        </section>
    </main>
</body>
</html>
