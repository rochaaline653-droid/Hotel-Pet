<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Nova Reserva</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">

    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pets.html">Pets</a>
        <a href="reservas.html" class="ativo">Reservas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>

</header>


<main class="conteudo">

    <section class="formulario-centralizado">

        <h1>Nova Reserva</h1>

        <p>
            Cadastre uma nova hospedagem.
        </p>


        <form action="reservas.html">

            <label for="pet">
                Pet
            </label>

            <select id="pet" required>

                <option value="">
                    Selecione o Pet
                </option>

                <option>
                    Max - Ana Souza
                </option>

                <option>
                    Lulu - Bruno Silva
                </option>

                <option>
                    Zico - Carla Oliveira
                </option>

                <option>
                    Nina - Daniel Santos
                </option>

            </select>


            <label for="entrada">
                Data de entrada
            </label>

            <input
                type="date"
                id="entrada"
                value="2026-09-15"
                required
            >


            <label for="saida">
                Data de saída
            </label>

            <input
                type="date"
                id="saida"
                value="2026-09-18"
                required
            >


            <label for="informacoes">
                Informações sobre o Pet
            </label>

            <textarea
                id="informacoes"
                rows="4"
                placeholder="Informe cuidados especiais, alimentação etc.">
            </textarea>


            <div class="valor-reserva">

                <span>
                    Valor da diária:
                </span>

                <strong>
                    R$ 50,00
                </strong>

            </div>


            <div class="valor-reserva">

                <span>
                    Total estimado:
                </span>

                <strong>
                    R$ 150,00
                </strong>

            </div>


            <div class="botoes-formulario">

                <a href="reservas.html"
                    class="botao-secundario">
                    Cancelar
                </a>

                <button type="submit"
                        class="botao">
                    Salvar Reserva
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
