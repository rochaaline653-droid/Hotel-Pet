<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Cadastro de Usuário</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">

    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pet.html">Pets</a>
        <a href="reservas.html">Reservas</a>
        <a href="usuarios.html" class="ativo">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>

</header>


<main class="conteudo">

    <section class="formulario-centralizado">

        <h1>Cadastro de Usuário</h1>

        <p>
            Cadastre um novo usuário no sistema.
        </p>


        <form action="usuarios.html">

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome"
                required
            >


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite o e-mail"
                required
            >


            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                placeholder="Digite o telefone"
            >


            <label for="funcao">
                Função
            </label>

            <select id="funcao">

                <option>Cliente</option>
                <option>Funcionário</option>
                <option>Gerente</option>

            </select>


            <label for="status">
                Status
            </label>

            <select id="status">

                <option>Ativo</option>
                <option>Inativo</option>

            </select>


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite a senha"
            >


            <div class="botoes-formulario">

                <a href="usuarios.html"
                    class="botao-secundario">
                    Cancelar
                </a>

                <button type="submit"
                        class="botao">
                    Cadastrar Usuário
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
