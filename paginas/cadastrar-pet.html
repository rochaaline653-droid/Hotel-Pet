<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Cadastro de Pet</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">

    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pets.html" class="ativo">Pets</a>
        <a href="reservas.html">Reservas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>

</header>


<main class="conteudo">

    <section class="formulario-pet">

        <div class="formulario-pet-conteudo">

            <h1>Cadastro de Pet</h1>

            <p>
                Cadastre um novo animal no sistema.
            </p>

            <form action="pets.html">

                <label for="nome">
                    Nome do Pet
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome"
                    required
                >


                <label for="tipo">
                    Tipo de animal
                </label>

                <select id="tipo">

                    <option>Cachorro</option>
                    <option>Gato</option>
                    <option>Outro</option>

                </select>


                <label for="raca">
                    Raça
                </label>

                <input
                    type="text"
                    id="raca"
                    placeholder="Digite a raça"
                >


                <label for="tamanho">
                    Tamanho
                </label>

                <select id="tamanho">

                    <option>Pequeno</option>
                    <option>Médio</option>
                    <option>Grande</option>

                </select>


                <label for="proprietario">
                    Proprietário
                </label>

                <select id="proprietario">

                    <option>Ana Souza</option>
                    <option>Bruno Silva</option>
                    <option>Carla Oliveira</option>
                    <option>Daniel Santos</option>

                </select>


                <label for="foto">
                    Link da foto
                </label>

                <input
                    type="url"
                    id="foto"
                    placeholder="Cole o link da imagem"
                >


                <div class="botoes-formulario">

                    <a href="pets.html"
                        class="botao-secundario">
                        Cancelar
                    </a>

                    <button type="submit" class="botao">
                        Cadastrar Pet
                    </button>

                </div>

            </form>

        </div>


        <aside class="imagem-pet-novo">

            <h3>Foto do Pet</h3>

            <img
                src="../imagens/cachorro-max.jpeg"
                alt="Exemplo de Pet">

            <p>
                A imagem do Pet será exibida nesta área.
            </p>

        </aside>

    </section>

</main>

</body>
</html>
