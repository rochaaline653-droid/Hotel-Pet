
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Visualizar Reserva</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">

    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pets.html">Pets</a>
        <a href="reservas.html" class="ativo">Reservas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>

</header>

<main class="conteudo">

    <section class="detalhes-reserva">

        <div class="cabecalho-detalhes">

            <div>
                <h1 id="tituloReserva">Reserva</h1>
                <p id="numeroReserva">Reserva nº</p>
            </div>

            <span id="statusReserva" class="status reservado">
                Reservada
            </span>

        </div>

        <div class="dados-reserva">

            <div>
                <strong>Pet</strong>
                <span id="petReserva"></span>
            </div>

            <div>
                <strong>Proprietário</strong>
                <span id="proprietarioReserva"></span>
            </div>

            <div>
                <strong>Entrada</strong>
                <span id="entradaReserva"></span>
            </div>

            <div>
                <strong>Saída</strong>
                <span id="saidaReserva"></span>
            </div>

            <div>
                <strong>Diárias</strong>
                <span id="diariasReserva"></span>
            </div>

            <div>
                <strong>Valor</strong>
                <span id="valorReserva"></span>
            </div>

        </div>

        <div class="observacoes">

            <h2>Informações sobre o Pet</h2>

            <p id="anotacoesReserva">
                Nenhuma informação cadastrada.
            </p>

        </div>

        <div class="botoes-formulario">

            <a href="#" id="botaoEditarReserva" class="botao">
                Editar Reserva
            </a>

            <a href="reservas.html" class="botao-secundario">
                Voltar
            </a>

        </div>

    </section>

</main>

<script src="../js/navegacao.js"></script>
<script src="../js/visualizar-reserva.js"></script>

</body>
</html>
