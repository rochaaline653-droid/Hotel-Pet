<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Visualizar Pet</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">

    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pets.html" class="ativo">Pets</a>
        <a href="reservas.html">Reservas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>

</header>


<main class="conteudo">

    <section class="visualizar-pet">

        <div class="foto-visualizar-pet">

            <img
                src="../imagens/cachorro-max.jpeg"
                alt="Max">

        </div>


        <div class="informacoes-pet">

            <h1>Max</h1>

            <p>
                <strong>Tipo:</strong>
                Cachorro
            </p>

            <p>
                <strong>Raça:</strong>
                Golden Retriever
            </p>

            <p>
                <strong>Tamanho:</strong>
                Grande
            </p>

            <p>
                <strong>Proprietário:</strong>
                Ana Souza
            </p>

            <div class="botoes-formulario">

                <a href="editar-pet.html"
                    class="botao">
                    Editar Pet
                </a>

                <a href="pets.html"
                    class="botao-secundario">
                    Voltar
                </a>

            </div>

        </div>

    </section>


    <section class="tabela-container">

        <h2>Histórico de Reservas</h2>

        <table>

            <thead>
                <tr>
                    <th>Entrada</th>
                    <th>Saída</th>
                    <th>Diárias</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>25/08/2026</td>
                    <td>28/08/2026</td>
                    <td>3</td>
                    <td>R$ 150,00</td>
                    <td>Reservada</td>
                </tr>

            </tbody>

        </table>

    </section>

</main>

</body>
</html>
