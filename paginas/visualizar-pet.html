<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Visualizar Pet</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">
    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pets.html" class="ativo">Pets</a>
        <a href="reservas.html">Reservas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>
</header>

<main class="conteudo">

    <section class="visualizar-pet">

        <div class="foto-visualizar-pet">
            <img id="fotoPet" src="../imagens/cachorro-max.jpeg" alt="Foto do pet">
        </div>

        <div class="informacoes-pet">

            <h1 id="nomePet">Nome do Pet</h1>

            <p><strong>Tipo:</strong> <span id="tipoPet"></span></p>

            <p><strong>Raça:</strong> <span id="racaPet"></span></p>

            <p><strong>Tamanho:</strong> <span id="tamanhoPet"></span></p>

            <p><strong>Proprietário:</strong> <span id="proprietarioPet"></span></p>

            <div class="botoes-formulario">

                <a href="#" id="botaoEditar" class="botao">
                    Editar Pet
                </a>

                <a href="pets.html" class="botao-secundario">
                    Voltar
                </a>

            </div>

        </div>

    </section>

    <section class="tabela-container">

        <h2>Histórico de Reservas</h2>

        <table>
            <thead>
                <tr>
                    <th>Entrada</th>
                    <th>Saída</th>
                    <th>Diárias</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="historicoReservas">
            </tbody>
        </table>

    </section>

</main>

<script src="../js/navegacao.js"></script>
<script src="../js/visualizar-pet.js"></script>

</body>
</html>
