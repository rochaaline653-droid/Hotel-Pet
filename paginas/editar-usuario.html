<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Editar Usuário</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">

    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pets.html">Pets</a>
        <a href="reservas.html">Reservas</a>
        <a href="usuarios.html" class="ativo">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>

</header>


<main class="conteudo">

    <section class="formulario-centralizado">

        <h1>
            Editar Usuário
        </h1>

        <p>
            O gerente pode alterar a função do usuário.
        </p>


        <form action="visualizar-usuario.html">

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                value="Ana Souza"
            >


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                value="ana@email.com"
            >


            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                value="(77) 99999-1111"
            >


            <label for="funcao">
                Função
            </label>

            <select id="funcao">

                <option selected>
                    Cliente
                </option>

                <option>
                    Funcionário
                </option>

                <option>
                    Gerente
                </option>

            </select>


            <label for="status">
                Status
            </label>

            <select id="status">

                <option selected>
                    Ativo
                </option>

                <option>
                    Inativo
                </option>

            </select>


            <div class="botoes-formulario">

                <a href="usuarios.html"
                    class="botao-secundario">
                    Cancelar
                </a>

                <button type="submit"
                        class="botao">
                    Salvar alterações
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
