<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Editar Reserva Finalizada</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">

    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pets.html">Pets</a>
        <a href="reservas.html" class="ativo">Reservas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>

</header>

<main class="conteudo">

    <section class="formulario-centralizado">

        <div class="aviso-gerente">
            <strong>Acesso do Gerente</strong>

            <p>
                O gerente pode alterar informações de
                reservas finalizadas.
            </p>
        </div>

        <h1>Editar Reserva Finalizada</h1>

        <p id="descricaoReserva">Carregando reserva...</p>

        <form>

            <label for="pet">Pet</label>
            <select id="pet" required></select>

            <label for="entrada">Data de entrada</label>
            <input type="date" id="entrada" required>

            <label for="saida">Data de saída</label>
            <input type="date" id="saida" required>

            <label for="status">Status</label>
            <select id="status">
                <option>Reservada</option>
                <option>Hospedado</option>
                <option>Finalizada</option>
            </select>

            <label for="anotacoes">Anotações da estadia</label>
            <textarea id="anotacoes" rows="5"></textarea>

            <label for="recibo">Recibo / Nota da estadia</label>
            <textarea id="recibo" rows="4"></textarea>

            <div class="valor-reserva">
                <span>Valor da diária:</span>
                <strong id="valorDiaria">R$ 50,00</strong>
            </div>

            <div class="valor-reserva">
                <span>Total:</span>
                <strong id="valorTotal">R$ 0,00</strong>
            </div>

            <div class="botoes-formulario">

                <a href="reservas.html" class="botao-secundario">
                    Cancelar
                </a>

                <button type="submit" class="botao">
                    Salvar alterações
                </button>

            </div>

        </form>

    </section>

</main>

<script src="../js/navegacao.js"></script>
<script src="../js/reservas.js"></script>

</body>
</html>
