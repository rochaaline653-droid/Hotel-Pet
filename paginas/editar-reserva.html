<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Editar Reserva</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">

    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pets.html">Pets</a>
        <a href="reservas.html" class="ativo">Reservas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>

</header>


<main class="conteudo">

    <section class="formulario-centralizado">

        <h1>
            Editar Reserva
        </h1>

        <p>
            Altere os dados da reserva.
        </p>


        <form action="visualizar-reserva.html">

            <label for="pet">
                Pet
            </label>

            <select id="pet">

                <option selected>
                    Max - Ana Souza
                </option>

                <option>
                    Lulu - Bruno Silva
                </option>

                <option>
                    Zico - Carla Oliveira
                </option>

                <option>
                    Nina - Daniel Santos
                </option>

            </select>


            <label for="entrada">
                Data de entrada
            </label>

            <input
                type="date"
                id="entrada"
                value="2026-08-25"
            >


            <label for="saida">
                Data de saída
            </label>

            <input
                type="date"
                id="saida"
                value="2026-08-28"
            >


            <label for="status">
                Status da reserva
            </label>

            <select id="status">

                <option selected>
                    Reservada
                </option>

                <option>
                    Hospedado
                </option>

                <option>
                    Finalizada
                </option>

            </select>


            <label for="anotacoes">
                Anotações
            </label>

            <textarea
                id="anotacoes"
                rows="5">
Max está se adaptando bem ao ambiente.
            </textarea>


            <label for="imagem">
                Link da imagem
            </label>

            <input
                type="url"
                id="imagem"
                placeholder="/imagens/cachorro-max.jpeg">

            
            <div class="valor-reserva">

                <span>
                    Valor da diária:
                </span>

                <strong>
                    R$ 50,00
                </strong>

            </div>


            <div class="valor-reserva">

                <span>
                    Total:
                </span>

                <strong>
                    R$ 150,00
                </strong>

            </div>


            <div class="botoes-formulario">

                <a href="reservas.html"
                    class="botao-secundario">
                    Cancelar
                </a>

                <button type="submit"
                        class="botao">
                    Salvar alterações
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
