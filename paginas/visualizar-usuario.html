
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Visualizar Usuário</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topo">

    <div class="logo">Hotel Pet</div>

    <nav>
        <a href="pets.html">Pets</a>
        <a href="reservas.html">Reservas</a>
        <a href="usuarios.html" class="ativo">Usuários</a>
        <a href="configuracoes.html">Configurações</a>
    </nav>

    <div class="usuario-topo">
        <span>Gerente</span>
        <a href="perfil.html">Perfil</a>
        <a href="../index.html">Sair</a>
    </div>

</header>

<main class="conteudo">

    <section class="visualizar-usuario">

        <div class="avatar-usuario" id="avatarUsuario">
            US
        </div>

        <div class="informacoes-usuario">

            <h1 id="nomeUsuario">Nome do usuário</h1>

            <p>
                <strong>E-mail:</strong>
                <span id="emailUsuario"></span>
            </p>

            <p>
                <strong>Telefone:</strong>
                <span id="telefoneUsuario"></span>
            </p>

            <p>
                <strong>Função:</strong>
                <span id="funcaoUsuario"></span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="statusUsuario"></span>
            </p>

            <div class="botoes-formulario">

                <a href="#" id="botaoEditarUsuario" class="botao">
                    Editar Usuário
                </a>

                <a href="usuarios.html" class="botao-secundario">
                    Voltar
                </a>

            </div>

        </div>

    </section>

</main>

<script src="../js/navegacao.js"></script>
<script src="../js/visualizar-usuario.js"></script>

</html>
