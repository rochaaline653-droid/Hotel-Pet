<body>
    <header>

        <div class="usuario-topo">
            <span>◯</span>
            <a href="perfil.html">João da Silva</a>
        </div>
    </header>

    <aside>
        <nav aria-label="Menu principal">
            <ul>

    <main>
        <div class="breadcrumb">Home / Pets / Editar Pet</div>
        
<section class="conteudo">
    <h1>Editar Pet</h1>
    <form action="pets.html">
        <label for="nome">Nome *</label>
        <input id="nome" type="text" value="Max">

        <label for="tipo">Tipo *</label>
        <select id="tipo">
            <option>Cachorro</option>
            <option>Gato</option>
            <option>Outro</option>
        </select>

        <label for="raca">Raça *</label>
        <input id="raca" type="text" value="Pastor Alemão">

        <label for="tamanho">Tamanho *</label>
        <select id="tamanho">
            <option>Pequeno</option>
            <option>Médio</option>
            <option>Grande</option>
        </select>

        <label for="imagem">Imagem</label>
        <input id="imagem" type="file" accept="image/*">

        <button type="submit">Salvar</button>
        <button type="reset">Limpar</button>
    </form>
</section>

    </main>
</body>
