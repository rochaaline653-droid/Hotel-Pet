<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Meu Perfil</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .dados-perfil {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dados-perfil label {
            font-weight: bold;
            color: #333;
            margin-top: 12px;
        }

        .dados-perfil p {
            background-color: #f5f7fa;
            padding: 16px 18px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin: 0;
            min-height: 22px;
        }

        .botoes-formulario {
            margin-top: 35px;
        }
    </style>
</head>

<body>

    <header class="topo">

        <div class="logo">Hotel Pet</div>

        <nav>
            <a href="pets.html">Pets</a>
            <a href="reservas.html">Reservas</a>
            <a href="usuarios.html">Usuários</a>
            <a href="configuracoes.html">Configurações</a>
        </nav>

        <div class="usuario-topo">
            <span>Gerente</span>
            <a href="perfil.html" class="ativo">Perfil</a>
            <a href="../index.html">Sair</a>
        </div>

    </header>

    <main class="conteudo">

        <section class="formulario-centralizado">

            <h1>Meu Perfil</h1>

            <p>
                Informações da gerente responsável pelo Hotel Pet.
            </p>

            <div class="dados-perfil">

                <label>Nome completo</label>
                <p>Aline Rocha</p>

                <label>E-mail</label>
                <p>gerente@hotelpet.com</p>

                <label>Telefone</label>
                <p>(77) 99999-5555</p>

                <label>Função</label>
                <p>Gerente</p>

            </div>

            <div class="botoes-formulario">

                <a href="usuarios.html" class="botao">
                    Voltar
                </a>

            </div>

        </section>

    </main>

    <script src="../js/navegacao.js"></script>

</body>
</html>
