<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Hotel Pet</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="reservas.html">Hotel Pet</a></div>
        <div class="usuario-topo">
            <span>◯</span>
            <a href="perfil.html">João da Silva</a>
        </div>
    </header>

    <aside>
        <nav aria-label="Menu principal">
            <ul>
                <li class=""><a href="pets.html">Pets</a></li>
                <li class="active"><a href="usuarios.html">Usuários</a></li>
                <li class=""><a href="configuracoes.html">Configurações</a></li>
                <li class=""><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <div class="breadcrumb">Home / Editar Perfil</div>
        
<section class="conteudo">
    <h1>Editar Perfil</h1>
    <form action="reservas.html">
        <label for="email">Email *</label>
        <input id="email" type="email" value="joaosilva@pet.com">

        <label for="nome">Nome *</label>
        <input id="nome" type="text" value="João">

        <label for="sobrenome">Sobrenome</label>
        <input id="sobrenome" type="text" value="da Silva">

        <label for="telefone">Telefone</label>
        <input id="telefone" type="tel" value="+55 (77) 99999-9999">

        <label for="funcao">Função</label>
        <select id="funcao">
            <option selected>Gerente</option>
            <option>Funcionário</option>
            <option>Cliente</option>
        </select>

        <label for="foto">Foto</label>
        <input id="foto" type="file" accept="image/*">

        <button type="submit">Salvar</button>
        <button type="reset">Limpar</button>
    </form>
</section>

    </main>
</body>
</html>
